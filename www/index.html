<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06122a">
  <title>Kulzzy Radio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #06122a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }

    .container {
      max-width: 420px;
    }

    h1 {
      color: #ffd700;
      font-size: 30px;
      margin-bottom: 10px;
    }

    p {
      color: #ffffff;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 25px;
      background: #ffd700;
      color: #06122a;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>KULZZY RADIO</h1>

    <p>Celebrating Lives Everyday</p>

    <p>
      Your celebration community is just a tap away.
    </p>

    <a class="button"
       href="https://kulzzy.github.io/app/">
       OPEN KULZZY RADIO
    </a>
  </div>
</body>
</html>
