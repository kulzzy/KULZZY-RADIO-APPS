name: Build Kulzzy Radio Desktop Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            target: --win nsis

          - os: macos-latest
            platform: macOS
            target: --mac dmg

          - os: ubuntu-latest
            platform: Linux
            target: --linux AppImage

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create desktop app files
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "kulzzy-radio",
            "version": "1.0.0",
            "description": "Kulzzy Radio Desktop App",
            "main": "main.js",
            "scripts": {
              "start": "electron ."
            },
            "devDependencies": {
              "electron": "^39.0.0",
              "electron-builder": "^26.0.0"
            },
            "build": {
              "appId": "com.kulzzy.radio",
              "productName": "Kulzzy Radio",
              "directories": {
                "output": "dist"
              },
              "win": {
                "target": ["nsis"]
              },
              "mac": {
                "target": ["dmg"],
                "extendInfo": {
                  "NSCameraUsageDescription": "Kulzzy Radio needs camera access for Community Feed camera features.",
                  "NSMicrophoneUsageDescription": "Kulzzy Radio needs microphone access for audio features."
                }
              },
              "linux": {
                "target": ["AppImage"]
              }
            }
          }
          EOF

          cat > main.js <<'EOF'
          const {
            app,
            BrowserWindow,
            session,
            shell,
            systemPreferences
          } = require('electron');

          const MAIN_URL = 'https://kulzzy.github.io/app/';

          const TRUSTED_ORIGINS = new Set([
            'https://kulzzy.github.io',
            'https://kulzzyradio.com',
            'https://www.kulzzyradio.com'
          ]);

          function isTrustedOrigin(value) {
            try {
              const url = new URL(value);
              return url.protocol === 'https:' &&
                     TRUSTED_ORIGINS.has(url.origin);
            } catch {
              return false;
            }
          }

          async function requestMediaAccess(mediaTypes) {
            if (process.platform !== 'darwin') {
              return true;
            }

            for (const type of mediaTypes) {
              if (type === 'video') {
                const allowed =
                  await systemPreferences.askForMediaAccess('camera');

                if (!allowed) return false;
              }

              if (type === 'audio') {
                const allowed =
                  await systemPreferences.askForMediaAccess('microphone');

                if (!allowed) return false;
              }
            }

            return true;
          }

          function configurePermissions() {
            const appSession = session.defaultSession;

            appSession.setPermissionRequestHandler(
              async (webContents, permission, callback, details = {}) => {

                const requestingUrl =
                  details.requestingUrl ||
                  details.securityOrigin ||
                  '';

                if (!isTrustedOrigin(requestingUrl)) {
                  callback(false);
                  return;
                }

                if (permission === 'media') {
                  const mediaTypes = details.mediaTypes || [];

                  if (
                    !mediaTypes.includes('video') &&
                    !mediaTypes.includes('audio')
                  ) {
                    callback(false);
                    return;
                  }

                  try {
                    const allowed =
                      await requestMediaAccess(mediaTypes);

                    callback(allowed);
                  } catch (error) {
                    console.error('Media permission error:', error);
                    callback(false);
                  }

                  return;
                }

                if (permission === 'notifications') {
                  callback(true);
                  return;
                }

                callback(false);
              }
            );

            appSession.setPermissionCheckHandler(
              (webContents, permission, requestingOrigin) => {

                if (!isTrustedOrigin(requestingOrigin)) {
                  return false;
                }

                return (
                  permission === 'media' ||
                  permission === 'notifications'
                );
              }
            );
          }

          function createWindow() {
            const win = new BrowserWindow({
              width: 1200,
              height: 800,
              minWidth: 800,
              minHeight: 600,
              title: 'Kulzzy Radio',
              autoHideMenuBar: true,

              webPreferences: {
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true
              }
            });

            win.loadURL(MAIN_URL);

            win.webContents.setWindowOpenHandler(({ url }) => {
              try {
                const parsed = new URL(url);

                if (
                  parsed.protocol === 'https:' ||
                  parsed.protocol === 'mailto:'
                ) {
                  shell.openExternal(url);
                }
              } catch (error) {
                console.error('Blocked invalid external link:', url);
              }

              return { action: 'deny' };
            });
          }

          app.whenReady().then(() => {
            configurePermissions();
            createWindow();
          });

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') {
              app.quit();
            }
          });

          app.on('activate', () => {
            if (BrowserWindow.getAllWindows().length === 0) {
              createWindow();
            }
          });
          EOF

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Save installer
        uses: actions/upload-artifact@v4
        with:
          name: Kulzzy-Radio-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Permanent Downloads
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: Kulzzy-Radio-*
          path: downloads
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.0.0
          name: Kulzzy Radio Desktop Apps v1.0.0
          body: |
            Official Kulzzy Radio desktop applications.

            Windows: Download the .exe installer.
            macOS: Download the .dmg installer.
            Linux: Download the .AppImage installer.

            Camera and microphone permission handling is included.
            Desktop notification permission handling is included.

            Requires an internet connection to listen to Kulzzy Radio.
          files: downloads/*
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
