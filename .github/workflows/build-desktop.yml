name: Build Kulzzy Radio Desktop Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            target: --win nsis
          - os: macos-latest
            platform: macOS
            target: --mac dmg
          - os: ubuntu-latest
            platform: Linux
            target: --linux AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create desktop app files
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "kulzzy-radio",
            "version": "1.0.0",
            "description": "Kulzzy Radio Desktop App",
            "main": "main.js",
            "scripts": {
              "start": "electron ."
            },
            "devDependencies": {
              "electron": "^39.0.0",
              "electron-builder": "^26.0.0"
            },
            "build": {
              "appId": "com.kulzzy.radio",
              "productName": "Kulzzy Radio",
              "directories": {
                "output": "dist"
              },
              "win": {
                "target": ["nsis"]
              },
              "mac": {
                "target": ["dmg"]
              },
              "linux": {
                "target": ["AppImage"]
              }
            }
          }
          EOF

          cat > main.js <<'EOF'
          const { app, BrowserWindow } = require('electron');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1200,
              height: 800,
              minWidth: 800,
              minHeight: 600,
              title: 'Kulzzy Radio',
              autoHideMenuBar: true
            });

            win.loadURL('https://kulzzy.github.io/app/');

            win.webContents.setWindowOpenHandler(({ url }) => {
              const { shell } = require('electron');
              shell.openExternal(url);
              return { action: 'deny' };
            });
          }

          app.whenReady().then(createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });

          app.on('activate', () => {
            if (BrowserWindow.getAllWindows().length === 0) {
              createWindow();
            }
          });
          EOF

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Save installer
        uses: actions/upload-artifact@v4
        with:
          name: Kulzzy-Radio-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Permanent Downloads
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: Kulzzy-Radio-*
          path: downloads
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.0.0
          name: Kulzzy Radio Desktop Apps v1.0.0
          body: |
            Official Kulzzy Radio desktop applications.

            Windows: Download the .exe installer.
            macOS: Download the .dmg installer.
            Linux: Download the .AppImage installer.

            Requires an internet connection to listen to Kulzzy Radio.
          files: downloads/*
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
