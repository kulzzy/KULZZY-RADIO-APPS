name: Build and Publish Kulzzy Radio APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release version"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Python and Pillow
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Restore persistent Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kulzzy-android-signing-key-v1

      - name: Prepare Android signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Install dependencies
        run: npm install

      - name: Create Android application
        run: npx cap add android

      - name: Sync application
        run: npx cap sync android

      - name: Download official Kulzzy Radio logo
        run: |
          curl -fL \
            https://raw.githubusercontent.com/kulzzy/app/main/icon-512.png \
            -o kulzzy-icon-512.png

      - name: Generate launcher icons
        run: python scripts/generate-icons.py

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare direct APK download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Kulzzy-Radio.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Kulzzy Radio $TAG" \
              --notes "Official Kulzzy Radio Android application."
          fi

          gh release upload "$TAG" Kulzzy-Radio.apk --clobber
