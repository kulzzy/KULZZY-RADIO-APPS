name: Build Kulzzy Radio Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'www/**'
      - 'scripts/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Python and Pillow
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Install project dependencies
        run: npm install

      - name: Create Android application
        run: npx cap add android

      - name: Sync application
        run: npx cap sync android

      - name: Download official Kulzzy Radio logo
        run: |
          curl -fL \
          https://raw.githubusercontent.com/kulzzy/app/main/icon-512.png \
          -o kulzzy-icon-512.png

      - name: Generate Android launcher icons
        run: python scripts/generate-icons.py

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: KULZZY-RADIO-ANDROID-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
